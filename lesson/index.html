                </div>
                <div class="lesson-actions">
                    <button id="resetBtn" class="btn btn-danger" type="button">Doğru Geçmişini Sıfırla</button>
                    <button id="startBtn" class="btn btn-primary" type="button">Başla</button>
                </div>
                <p id="setupHint" class="lesson-subtitle muted mt-12"></p>
            </section>
            <section id="quiz" class="lesson-card hidden" aria-live="polite">
                <div class="status-row">
                    <div class="pill pill-lesson" id="statusLesson"></div>
                    <div class="pill pill-progress" id="statusProgress"></div>
                </div>
                <div class="question-top mt-12">
                    <h2 class="lesson-title" id="qHeader"></h2>
                </div>
                <p class="q-text" id="qText"></p>
                <div class="options" id="options"></div>
                <div id="explain" class="explain hidden"></div>
                <div class="lesson-actions lesson-actions-split">
                    <button id="backToSetupBtn" class="btn btn-ghost" type="button">Ana Menü</button>
                    <button id="nextBtn" class="btn btn-primary" type="button">Sonraki</button>
                </div>
            </section>
            <section id="done" class="lesson-card hidden">
                <h2 class="lesson-title">Bitti</h2>
                <p class="lesson-subtitle" id="doneText"></p>
                <div class="lesson-actions">
                    <button id="doneBackBtn" class="btn btn-primary" type="button">Ana Menü</button>
                </div>
            </section>
            <section id="error" class="lesson-card hidden">
                <h2 class="lesson-title">Hata</h2>
                <p class="lesson-subtitle" id="errorText"></p>
            </section>
        </div>
    </main>

    <!---->
    <script>
        (function () {
            "use strict";

            const LESSONS = [
                {
                    key: "isletim-sistemleri-final",
                    title: "İşletim Sistemleri (Final)",
                    masterPath: "isletim-sistemleri-final/master.json",
                },
            ];

            const STORAGE_KEY = "mfmx.lesson.quiz.progress.v1";

            function loadProgress() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) return {};
                    const parsed = JSON.parse(raw);
                    if (!parsed || typeof parsed !== "object") return {};
                    return parsed;
                } catch {
                    return {};
                }
            }

            function saveProgress(progress) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
            }

            function getScopeKey(lessonKey) {
                return `${lessonKey}::ALL`;
            }

            function normalizeOptions(options) {
                if (!options) return [];
                if (Array.isArray(options)) {
                    return options
                        .map((x) => {
                            if (!x) return null;
                            if (typeof x === "string") return { key: "", text: x };
                            const key = x.key ?? x.id ?? "";
                            const text = x.text ?? x.value ?? "";
                            return { key: String(key), text: String(text) };
                        })
                        .filter(Boolean);
                }
                if (typeof options === "object") {
                    const keys = Object.keys(options).sort();
                    return keys.map((k) => ({ key: k, text: String(options[k]) }));
                }
                return [];
            }

            async function fetchJson(path) {
                const res = await fetch(path, { cache: "no-store" });
                if (!res.ok) {
                    throw new Error(`JSON yüklenemedi: ${path} (HTTP ${res.status})`);
                }
                return await res.json();
            }

            function pickRandom(arr) {
                return arr[Math.floor(Math.random() * arr.length)];
            }

            function shuffleCopy(arr) {
                const copy = [...arr];
                for (let i = copy.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [copy[i], copy[j]] = [copy[j], copy[i]];
                }
                return copy;
            }

            function buildDisplayOptions(question, lastCorrectIndex) {
                const letters = ["A", "B", "C", "D", "E", "F", "G", "H"]; // güvenli üst sınır
                const original = question.options.length ? question.options : [{ key: "", text: "(Seçenek bulunamadı)" }];
                let shuffled = shuffleCopy(original).map((opt) => ({
                    originalKey: opt.key,
                    text: opt.text,
                    isCorrect: String(opt.key).trim() === String(question.correct).trim(),
                }));

                // Doğru seçeneğin ekrandaki pozisyonu sürekli aynı olmasın (mümkünse kaydır).
                if (shuffled.length > 1) {
                    const correctIdx = shuffled.findIndex((x) => x.isCorrect);
                    if (correctIdx !== -1 && lastCorrectIndex != null && correctIdx === lastCorrectIndex) {
                        // 1 adım döndür (rotation) — dağılımı bozmaz ama doğru pozisyonu değiştirir.
                        shuffled = [shuffled[shuffled.length - 1], ...shuffled.slice(0, -1)];
                    }
                }

                const withDisplay = shuffled.map((opt, idx) => ({
                    displayKey: letters[idx] ?? String(idx + 1),
                    ...opt,
                }));

                const correctDisplayIndex = withDisplay.findIndex((x) => x.isCorrect);
                const correctDisplayKey = correctDisplayIndex !== -1 ? withDisplay[correctDisplayIndex].displayKey : "";
                return { options: withDisplay, correctDisplayIndex, correctDisplayKey };
            }

            function el(id) {
                return document.getElementById(id);
            }

            const lessonSelect = el("lessonSelect");
            const unitSelect = el("unitSelect");
            const modeSelect = el("modeSelect");
            const startBtn = el("startBtn");
            const resetBtn = el("resetBtn");
            const setupHint = el("setupHint");

            const introCard = el("introCard");

            const setup = el("setup");
            const quiz = el("quiz");
            const done = el("done");
            const doneText = el("doneText");
            const errorBox = el("error");
            const errorText = el("errorText");

            const statusLesson = el("statusLesson");
            const statusProgress = el("statusProgress");
            const qHeader = el("qHeader");
            const qText = el("qText");
            const optionsBox = el("options");
            const explainBox = el("explain");
            const nextBtn = el("nextBtn");
            const backToSetupBtn = el("backToSetupBtn");
            const doneBackBtn = el("doneBackBtn");

            let master = null;
            let questionPool = [];
            let activeQuestion = null;
            let activeLesson = null;
            let activeUnit = null;
            let activeMode = "random";
            let activeScopeKey = "";
            let sequentialIndex = -1;
            let activeDisplay = null;
            let lastCorrectDisplayIndex = null;
            let hasAnsweredCurrent = false;

            function showOnly(which) {
                setup.classList.toggle("hidden", which !== "setup");
                quiz.classList.toggle("hidden", which !== "quiz");
                done.classList.toggle("hidden", which !== "done");
                errorBox.classList.toggle("hidden", which !== "error");

                // Quiz başladığında üstteki açıklama kartını gizle
                if (introCard) {
                    introCard.classList.toggle("hidden", which !== "setup");
                }
            }

            function setError(message) {
                errorText.textContent = message;
                showOnly("error");
            }

            function updateSetupHint() {
                const lesson = LESSONS.find((x) => x.key === lessonSelect.value);
                const unitOpt = unitSelect.value;
                const mode = modeSelect.value;
                const unitLabel = unitOpt === "__all__" ? "Tüm üniteler" : (unitSelect.options[unitSelect.selectedIndex]?.textContent ?? "");
                const modeLabel = modeSelect.options[modeSelect.selectedIndex]?.textContent ?? "";
                setupHint.textContent = `Seçim: ${lesson?.title ?? ""} • ${unitLabel} • ${modeLabel}`;
            }

            async function loadMasterForLesson(lesson) {
                master = await fetchJson(lesson.masterPath);
                if (!master || !Array.isArray(master.units)) {
                    throw new Error("master.json formatı beklenenden farklı (units bulunamadı)");
                }
                return master;
            }

            function populateLessonSelect() {
                lessonSelect.innerHTML = "";
                for (const lesson of LESSONS) {
                    const opt = document.createElement("option");
                    opt.value = lesson.key;
                    opt.textContent = lesson.title;
                    lessonSelect.appendChild(opt);
                }
            }

            function populateUnitSelect(masterJson) {
                unitSelect.innerHTML = "";
                for (const u of masterJson.units) {
                    const opt = document.createElement("option");
                    opt.value = u.fileName;
                    opt.textContent = `${u.unitNumber}. Ünite — ${u.unitTitle}`;
                    unitSelect.appendChild(opt);
                }
            }

            async function refreshUnits() {
                const lesson = LESSONS.find((x) => x.key === lessonSelect.value);
                if (!lesson) return;
                try {
                    const m = await loadMasterForLesson(lesson);
                    populateUnitSelect(m);
                    updateSetupHint();
                } catch (e) {
                    setError(e?.message ?? String(e));
                }
            }

            function makeQuestionId(lessonKey, unitFileName, questionNo) {
                return `${lessonKey}::${unitFileName}::${questionNo}`;
            }

            function buildPoolFromUnitJson(lessonKey, unitFileName, unitJson) {
                if (!unitJson || !Array.isArray(unitJson.questions)) return [];
                return unitJson.questions
                    .map((q) => {
                        const no = q.No ?? q.no ?? q.id;
                        return {
                            id: makeQuestionId(lessonKey, unitFileName, no),
                            unitFileName,
                            unitNumber: unitJson.unitNumber ?? null,
                            unitTitle: unitJson.unitTitle ?? "",
                            no,
                            question: String(q.question ?? ""),
                            options: normalizeOptions(q.options),
                            correct: String(q.correct ?? "").trim(),
                            explanation: String(q.explanation ?? ""),
                        };
                    })
                    .filter((q) => q.no != null && q.question);
            }

            function getRemainingQuestions(pool, progressByScope) {
                const correctMap = progressByScope?.correct ?? {};
                return pool.filter((q) => !correctMap[q.id]);
            }

            function computeStats() {
                const progress = loadProgress();
                const scopeData = progress[activeScopeKey] ?? { correct: {}, wrongCount: {} };
                const remaining = getRemainingQuestions(questionPool, scopeData);

                const correctCount = Object.keys(scopeData.correct ?? {}).length;
                return { remainingCount: remaining.length, correctCount, totalLoaded: questionPool.length };
            }

            function renderStatus() {
                const { remainingCount, correctCount, totalLoaded } = computeStats();
                const unitLabel = activeMode === "all_random"
                    ? "Tüm üniteler"
                    : (activeUnit?.unitTitle ? `${activeUnit.unitNumber}. Ünite — ${activeUnit.unitTitle}` : "Ünite");

                statusLesson.textContent = `${activeLesson?.title ?? ""} • ${unitLabel} • ${activeMode === "sequential" ? "Sırayla" : "Rastgele"}`;
                statusProgress.textContent = `Kalan: ${remainingCount} / Yüklenen: ${totalLoaded} • Doğru: ${correctCount}`;
            }

            function renderQuestion(q) {
                activeQuestion = q;
                sequentialIndex = Math.max(sequentialIndex, 0);
                hasAnsweredCurrent = false;

                activeDisplay = buildDisplayOptions(q, lastCorrectDisplayIndex);
                lastCorrectDisplayIndex = activeDisplay.correctDisplayIndex;

                explainBox.classList.add("hidden");
                explainBox.classList.remove("explain-correct", "explain-wrong");
                explainBox.textContent = "";
                // Sonraki her zaman görünür; cevaplanmadıysa da geçilebilir.
                nextBtn.disabled = false;

                qHeader.textContent = `Soru ${q.no}`;
                qText.textContent = q.question;
                optionsBox.innerHTML = "";

                const opts = activeDisplay.options;
                for (const opt of opts) {
                    const btn = document.createElement("button");
                    btn.type = "button";
                    btn.className = "opt";
                    btn.dataset.displayKey = opt.displayKey;
                    btn.dataset.isCorrect = opt.isCorrect ? "1" : "0";
                    btn.textContent = `${opt.displayKey}) ${opt.text}`;
                    btn.addEventListener("click", () => handleAnswer(opt, btn));
                    optionsBox.appendChild(btn);
                }

                renderStatus();
                showOnly("quiz");
            }

            function handleAnswer(selectedOpt, clickedBtn) {
                if (!activeQuestion) return;
                hasAnsweredCurrent = true;
                const isCorrect = !!selectedOpt?.isCorrect;
                const correctDisplayKey = activeDisplay?.correctDisplayKey ?? "";

                const progress = loadProgress();
                const scopeData = progress[activeScopeKey] ?? { correct: {}, wrongCount: {} };
                scopeData.correct = scopeData.correct ?? {};
                scopeData.wrongCount = scopeData.wrongCount ?? {};

                if (isCorrect) {
                    scopeData.correct[activeQuestion.id] = true;
                } else {
                    scopeData.wrongCount[activeQuestion.id] = (scopeData.wrongCount[activeQuestion.id] ?? 0) + 1;
                }
                progress[activeScopeKey] = scopeData;
                saveProgress(progress);

                // lock buttons + style
                const buttons = Array.from(optionsBox.querySelectorAll("button.opt"));
                for (const b of buttons) {
                    b.disabled = true;
                    if ((b.dataset.isCorrect ?? "0") === "1") b.classList.add("opt-correct");
                }
                if (clickedBtn && !isCorrect) clickedBtn.classList.add("opt-wrong");

                explainBox.classList.remove("hidden");
                explainBox.classList.toggle("explain-correct", isCorrect);
                explainBox.classList.toggle("explain-wrong", !isCorrect);
                explainBox.textContent = isCorrect
                    ? `Doğru!\n\nAçıklama: ${activeQuestion.explanation || "(Açıklama yok)"}`
                    : `Yanlış. Doğru cevap: ${correctDisplayKey}\n\nAçıklama: ${activeQuestion.explanation || "(Açıklama yok)"}`;

                nextBtn.disabled = false;
                renderStatus();
            }

            function pickNextQuestion(avoidId) {
                const progress = loadProgress();
                const scopeData = progress[activeScopeKey] ?? { correct: {}, wrongCount: {} };
                const remaining = getRemainingQuestions(questionPool, scopeData);
                if (remaining.length === 0) return null;

                if (activeMode === "sequential") {
                    const sorted = [...questionPool].sort((a, b) => {
                        const ua = a.unitNumber ?? 0;
                        const ub = b.unitNumber ?? 0;
                        if (ua !== ub) return ua - ub;
                        return (a.no ?? 0) - (b.no ?? 0);
                    });

                    // Find next remaining after current index; wrap around once.
                    const idxById = new Map(sorted.map((q, idx) => [q.id, idx]));
                    let start = 0;
                    if (activeQuestion && idxById.has(activeQuestion.id)) {
                        start = idxById.get(activeQuestion.id) + 1;
                    }

                    for (let offset = 0; offset < sorted.length; offset++) {
                        const i = (start + offset) % sorted.length;
                        const q = sorted[i];
                        if (!scopeData.correct?.[q.id]) return q;
                    }
                    return null;
                }

                // random
                if (avoidId && remaining.length > 1) {
                    const filtered = remaining.filter((q) => q.id !== avoidId);
                    if (filtered.length) return pickRandom(filtered);
                }
                return pickRandom(remaining);
            }

            function finishIfDone() {
                const stats = computeStats();
                if (stats.remainingCount > 0) return false;

                doneText.textContent = `Bu seçim için yüklenen tüm sorular bitti. (Yüklenen: ${stats.totalLoaded}, Doğru: ${stats.correctCount})`;
                showOnly("done");
                return true;
            }

            async function startQuiz() {
                try {
                    showOnly("setup");

                    activeLesson = LESSONS.find((x) => x.key === lessonSelect.value);
                    if (!activeLesson) throw new Error("Ders seçimi bulunamadı");

                    if (!master) {
                        master = await loadMasterForLesson(activeLesson);
                    }

                    activeMode = modeSelect.value;

                    const selectedUnitFile = unitSelect.value;
                    const isAllUnits = activeMode === "all_random";
                    activeScopeKey = getScopeKey(activeLesson.key);

                    questionPool = [];
                    activeUnit = null;
                    sequentialIndex = -1;

                    if (isAllUnits) {
                        for (const u of master.units) {
                            const unitJson = await fetchJson(`${activeLesson.key}/${u.fileName}`);
                            questionPool.push(...buildPoolFromUnitJson(activeLesson.key, u.fileName, unitJson));
                        }
                    } else {
                        const u = master.units.find((x) => x.fileName === selectedUnitFile);
                        if (!u) throw new Error("Ünite seçimi bulunamadı");
                        activeUnit = u;
                        const unitJson = await fetchJson(`${activeLesson.key}/${u.fileName}`);
                        questionPool = buildPoolFromUnitJson(activeLesson.key, u.fileName, unitJson);
                    }

                    if (!questionPool.length) throw new Error("Soru bulunamadı (pool boş)");

                    if (finishIfDone()) return;

                    const next = pickNextQuestion(null);
                    if (!next) {
                        finishIfDone();
                        return;
                    }
                    renderQuestion(next);
                } catch (e) {
                    setError(e?.message ?? String(e));
                }
            }

            function resetProgress() {
                const lesson = LESSONS.find((x) => x.key === lessonSelect.value);
                if (!lesson) return;
                const scopeKey = getScopeKey(lesson.key);

                const ok = confirm("Bu seçim için doğru geçmişi sıfırlansın mı?\n\nNot: Bu işlem geri alınamaz.");
                if (!ok) return;

                const progress = loadProgress();
                for (const k of Object.keys(progress)) {
                    if (k === scopeKey || k.startsWith(`${lesson.key}::`)) delete progress[k];
                }
                saveProgress(progress);
                updateSetupHint();
                alert("Sıfırlandı.");
            }

            // events
            lessonSelect.addEventListener("change", async () => {
                await refreshUnits();
            });
            unitSelect.addEventListener("change", updateSetupHint);
            modeSelect.addEventListener("change", updateSetupHint);

            startBtn.addEventListener("click", startQuiz);
            resetBtn.addEventListener("click", resetProgress);

            nextBtn.addEventListener("click", () => {
                if (finishIfDone()) return;
                const avoidId = hasAnsweredCurrent ? null : (activeQuestion?.id ?? null);
                const next = pickNextQuestion(avoidId);
                if (!next) {
                    finishIfDone();
                    return;
                }
                renderQuestion(next);
            });

            backToSetupBtn.addEventListener("click", () => {
                showOnly("setup");
            });
            doneBackBtn.addEventListener("click", () => {
                showOnly("setup");
            });

            // init
            populateLessonSelect();
            refreshUnits();
            updateSetupHint();
        })();
    </script>
