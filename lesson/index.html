                            <option value="random">Rastgele (seçili ünite)</option>
                            <option value="sequential">Sırayla (seçili ünite)</option>
                            <option value="all_random">Tüm ünitelerden rastgele</option>
                        </select>
                    </label>
                    <label> Son güncelleme <span id="updatedAtText" class="static-field">-</span>
                    </label>
                </div>
                <div class="lesson-actions">
                    <button id="resetBtn" class="btn btn-danger" type="button">Doğru Geçmişini Sıfırla</button>
                    <button id="startBtn" class="btn btn-primary" type="button">Başla</button>
                </div>
                <p id="setupHint" class="lesson-subtitle muted mt-12"></p>
            </section>
            <section id="quiz" class="lesson-card hidden" aria-live="polite">
                <div class="status-row">
                    <div class="pill pill-lesson" id="statusLesson"></div>
                    <div class="pill pill-progress" id="statusProgress"></div>
                </div>
                <div class="question-top mt-12">
                    <h2 class="lesson-title" id="qHeader"></h2>
                </div>
                <p class="q-text" id="qText"></p>
                <div class="options" id="options"></div>
                <div id="explain" class="explain hidden"></div>
                <div class="lesson-actions lesson-actions-split">
                    <button id="backToSetupBtn" class="btn btn-ghost" type="button">Ana Menü</button>
                    <button id="nextBtn" class="btn btn-primary" type="button">Sonraki</button>
                </div>
            </section>
            <section id="done" class="lesson-card hidden">
                <h2 class="lesson-title">Bitti</h2>
                <p class="lesson-subtitle" id="doneText"></p>
                <div class="lesson-actions">
                    <button id="doneBackBtn" class="btn btn-primary" type="button">Ana Menü</button>
                </div>
            </section>
            <section id="error" class="lesson-card hidden">
                <h2 class="lesson-title">Hata</h2>
                <p class="lesson-subtitle" id="errorText"></p>
            </section>
        </div>
    </main>

    <!---->
    <script>
        (function () {
            "use strict";

            const LESSONS = [
                { key: "isg-2-2-final" },
                { key: "isletim-sistemleri-2-1-final" },
                { key: "gomulu-sistemler-2-1-final" },
                { key: "web-tasarımı-2-1-final" },
            ].map((lesson) => ({
                ...lesson,
                masterPath: `${lesson.key}/master.json`,
                title: lesson.key,
            }));

            const STORAGE_KEY = "mfmx.lesson.quiz.progress.v1";
            const LETTERS = ["A", "B", "C", "D", "E", "F", "G", "H"];
            const EMPTY_SCOPE = Object.freeze({ correct: {}, wrongCount: {} });

            const byId = (id) => document.getElementById(id);
            const lessonSelect = byId("lessonSelect");
            const unitSelect = byId("unitSelect");
            const modeSelect = byId("modeSelect");
            const updatedAtText = byId("updatedAtText");
            const startBtn = byId("startBtn");
            const resetBtn = byId("resetBtn");
            const setupHint = byId("setupHint");

            const introCard = byId("introCard");
            const setup = byId("setup");
            const quiz = byId("quiz");
            const done = byId("done");
            const doneText = byId("doneText");
            const errorBox = byId("error");
            const errorText = byId("errorText");

            const statusLesson = byId("statusLesson");
            const statusProgress = byId("statusProgress");
            const qHeader = byId("qHeader");
            const qText = byId("qText");
            const optionsBox = byId("options");
            const explainBox = byId("explain");
            const nextBtn = byId("nextBtn");
            const backToSetupBtn = byId("backToSetupBtn");
            const doneBackBtn = byId("doneBackBtn");

            const state = {
                currentLesson: null,
                currentMaster: null,
                currentUnit: null,
                mode: "random",
                scopeKey: "",
                questionPool: [],
                activeQuestion: null,
                activeDisplay: null,
                lastCorrectDisplayIndex: null,
                hasAnsweredCurrent: false,
            };

            const masterCache = new Map();

            const getScopeKey = (lessonKey) => `${lessonKey}::ALL`;
            const pickRandom = (arr) => arr[Math.floor(Math.random() * arr.length)];

            function showOnly(which) {
                setup.classList.toggle("hidden", which !== "setup");
                quiz.classList.toggle("hidden", which !== "quiz");
                done.classList.toggle("hidden", which !== "done");
                errorBox.classList.toggle("hidden", which !== "error");
                if (introCard) introCard.classList.toggle("hidden", which !== "setup");
            }

            function setError(message) {
                errorText.textContent = message;
                showOnly("error");
            }

            function loadProgress() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) return {};
                    const parsed = JSON.parse(raw);
                    return parsed && typeof parsed === "object" ? parsed : {};
                } catch {
                    return {};
                }
            }

            function saveProgress(progress) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
            }

            async function fetchJson(path) {
                const url = encodeURI(path);
                const res = await fetch(url, { cache: "no-store" });
                if (!res.ok) throw new Error(`JSON yüklenemedi: ${path} (HTTP ${res.status})`);
                return await res.json();
            }

            async function loadMaster(lesson) {
                if (masterCache.has(lesson.key)) return masterCache.get(lesson.key);
                const master = await fetchJson(lesson.masterPath);
                if (!master || !Array.isArray(master.units)) {
                    throw new Error("master.json formatı beklenenden farklı (units bulunamadı)");
                }
                masterCache.set(lesson.key, master);
                return master;
            }

            async function hydrateLessonTitles() {
                await Promise.all(
                    LESSONS.map(async (lesson) => {
                        try {
                            const master = await loadMaster(lesson);
                            const title = typeof master?.title === "string" ? master.title.trim() : "";
                            lesson.title = title || lesson.key;
                        } catch {
                            lesson.title = lesson.key;
                        }
                    })
                );
            }

            function updateSetupHint() {
                const lesson = LESSONS.find((x) => x.key === lessonSelect.value);
                const selectedUnitLabel = unitSelect.options[unitSelect.selectedIndex]?.textContent ?? "";
                const modeLabel = modeSelect.options[modeSelect.selectedIndex]?.textContent ?? "";
                const unitLabel = unitSelect.value === "__all__" ? "Tüm üniteler" : selectedUnitLabel;
                const lessonLabel = lesson?.title || lesson?.key || "Ad Bulunamadı";
                setupHint.textContent = `Seçim: ${lessonLabel} • ${unitLabel} • ${modeLabel}`;
            }

            function populateLessonSelect() {
                lessonSelect.innerHTML = "";
                for (const lesson of LESSONS) {
                    const opt = document.createElement("option");
                    opt.value = lesson.key;
                    opt.textContent = lesson.title || lesson.key;
                    lessonSelect.appendChild(opt);
                }
            }

            function populateUnitSelect(master) {
                unitSelect.innerHTML = "";
                for (const unit of master.units) {
                    const opt = document.createElement("option");
                    opt.value = unit.fileName;
                    opt.textContent = `${unit.unitNumber}. Ünite — ${unit.unitTitle}`;
                    unitSelect.appendChild(opt);
                }
            }

            async function refreshUnits() {
                const lesson = LESSONS.find((x) => x.key === lessonSelect.value);
                if (!lesson) return;
                try {
                    const master = await loadMaster(lesson);
                    state.currentLesson = lesson;
                    state.currentMaster = master;
                    populateUnitSelect(master);
                    if (updatedAtText) {
                        const updatedAt = typeof master?.guncellenmeTarihi === "string"
                            ? master.guncellenmeTarihi.trim()
                            : "";
                        updatedAtText.textContent = updatedAt || "-";
                    }
                    updateSetupHint();
                } catch (e) {
                    if (updatedAtText) updatedAtText.textContent = "-";
                    setError(e?.message ?? String(e));
                }
            }

            function normalizeOptions(options) {
                if (!options) return [];
                if (Array.isArray(options)) {
                    return options
                        .map((x) => {
                            if (!x) return null;
                            if (typeof x === "string") return { key: "", text: x };
                            const key = x.key ?? x.id ?? "";
                            const text = x.text ?? x.value ?? "";
                            return { key: String(key), text: String(text) };
                        })
                        .filter(Boolean);
                }
                if (typeof options === "object") {
                    return Object.keys(options)
                        .sort()
                        .map((k) => ({ key: k, text: String(options[k]) }));
                }
                return [];
            }

            function makeQuestionId(lessonKey, unitFileName, questionNo) {
                return `${lessonKey}::${unitFileName}::${questionNo}`;
            }

            function buildPoolFromUnitJson(lessonKey, unitFileName, unitJson) {
                if (!unitJson || !Array.isArray(unitJson.questions)) return [];
                return unitJson.questions
                    .map((q) => {
                        const no = q.No ?? q.no ?? q.id;
                        return {
                            id: makeQuestionId(lessonKey, unitFileName, no),
                            unitFileName,
                            unitNumber: unitJson.unitNumber ?? null,
                            unitTitle: unitJson.unitTitle ?? "",
                            no,
                            question: String(q.question ?? ""),
                            options: normalizeOptions(q.options),
                            correct: String(q.correct ?? "").trim(),
                            explanation: String(q.explanation ?? ""),
                        };
                    })
                    .filter((q) => q.no != null && q.question);
            }

            function getScopeData(progress, scopeKey) {
                return progress[scopeKey] ?? EMPTY_SCOPE;
            }

            function getRemainingQuestions(pool, progressByScope) {
                const correctMap = progressByScope?.correct ?? {};
                return pool.filter((q) => !correctMap[q.id]);
            }

            function computeStats() {
                const progress = loadProgress();
                const scopeData = getScopeData(progress, state.scopeKey);
                const remainingCount = getRemainingQuestions(state.questionPool, scopeData).length;
                const totalLoaded = state.questionPool.length;
                const correctCount = Math.max(0, totalLoaded - remainingCount);
                return { remainingCount, totalLoaded, correctCount };
            }

            function renderStatus() {
                const { remainingCount, totalLoaded, correctCount } = computeStats();
                const unitLabel = state.mode === "all_random"
                    ? "Tüm üniteler"
                    : (state.currentUnit?.unitTitle ? `${state.currentUnit.unitNumber}. Ünite — ${state.currentUnit.unitTitle}` : "Ünite");

                statusLesson.textContent = `${state.currentLesson?.title ?? ""} • ${unitLabel} • ${state.mode === "sequential" ? "Sırayla" : "Rastgele"}`;
                statusProgress.textContent = `Kalan: ${remainingCount} / Yüklenen: ${totalLoaded} • Doğru: ${correctCount}`;
            }

            function shuffleCopy(arr) {
                const copy = [...arr];
                for (let i = copy.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [copy[i], copy[j]] = [copy[j], copy[i]];
                }
                return copy;
            }

            function buildDisplayOptions(question, lastCorrectIndex) {
                const original = question.options.length
                    ? question.options
                    : [{ key: "", text: "(Seçenek bulunamadı)" }];

                let shuffled = shuffleCopy(original).map((opt) => ({
                    originalKey: opt.key,
                    text: opt.text,
                    isCorrect: String(opt.key).trim() === String(question.correct).trim(),
                }));

                if (shuffled.length > 1) {
                    const correctIdx = shuffled.findIndex((x) => x.isCorrect);
                    if (correctIdx !== -1 && lastCorrectIndex != null && correctIdx === lastCorrectIndex) {
                        shuffled = [shuffled[shuffled.length - 1], ...shuffled.slice(0, -1)];
                    }
                }

                const options = shuffled.map((opt, idx) => ({
                    displayKey: LETTERS[idx] ?? String(idx + 1),
                    ...opt,
                }));

                const correctDisplayIndex = options.findIndex((x) => x.isCorrect);
                const correctDisplayKey = correctDisplayIndex === -1 ? "" : options[correctDisplayIndex].displayKey;
                return { options, correctDisplayIndex, correctDisplayKey };
            }

            function renderQuestion(question) {
                state.activeQuestion = question;
                state.hasAnsweredCurrent = false;
                state.activeDisplay = buildDisplayOptions(question, state.lastCorrectDisplayIndex);
                state.lastCorrectDisplayIndex = state.activeDisplay.correctDisplayIndex;

                explainBox.classList.add("hidden");
                explainBox.classList.remove("explain-correct", "explain-wrong");
                explainBox.textContent = "";
                nextBtn.disabled = false;

                qHeader.textContent = `Soru ${question.no}`;
                qText.textContent = question.question;
                optionsBox.innerHTML = "";

                for (const opt of state.activeDisplay.options) {
                    const btn = document.createElement("button");
                    btn.type = "button";
                    btn.className = "opt";
                    btn.dataset.displayKey = opt.displayKey;
                    btn.dataset.isCorrect = opt.isCorrect ? "1" : "0";
                    btn.textContent = `${opt.displayKey}) ${opt.text}`;
                    btn.addEventListener("click", () => handleAnswer(opt, btn));
                    optionsBox.appendChild(btn);
                }

                renderStatus();
                showOnly("quiz");
            }

            function handleAnswer(selectedOpt, clickedBtn) {
                if (!state.activeQuestion) return;
                state.hasAnsweredCurrent = true;

                const isCorrect = !!selectedOpt?.isCorrect;
                const correctDisplayKey = state.activeDisplay?.correctDisplayKey ?? "";

                const progress = loadProgress();
                const scopeData = {
                    correct: { ...(getScopeData(progress, state.scopeKey).correct ?? {}) },
                    wrongCount: { ...(getScopeData(progress, state.scopeKey).wrongCount ?? {}) },
                };

                if (isCorrect) {
                    scopeData.correct[state.activeQuestion.id] = true;
                } else {
                    scopeData.wrongCount[state.activeQuestion.id] = (scopeData.wrongCount[state.activeQuestion.id] ?? 0) + 1;
                }

                progress[state.scopeKey] = scopeData;
                saveProgress(progress);

                const buttons = Array.from(optionsBox.querySelectorAll("button.opt"));
                for (const btn of buttons) {
                    btn.disabled = true;
                    if ((btn.dataset.isCorrect ?? "0") === "1") btn.classList.add("opt-correct");
                }
                if (clickedBtn && !isCorrect) clickedBtn.classList.add("opt-wrong");

                explainBox.classList.remove("hidden");
                explainBox.classList.toggle("explain-correct", isCorrect);
                explainBox.classList.toggle("explain-wrong", !isCorrect);
                explainBox.textContent = isCorrect
                    ? `Doğru!\n\n${state.activeQuestion.explanation || "(Açıklama yok)"}`
                    : `Yanlış. Doğru cevap: ${correctDisplayKey}\n\n${state.activeQuestion.explanation || "(Açıklama yok)"}`;

                renderStatus();
            }

            function pickNextQuestion(avoidId) {
                const progress = loadProgress();
                const scopeData = getScopeData(progress, state.scopeKey);
                const remaining = getRemainingQuestions(state.questionPool, scopeData);
                if (!remaining.length) return null;

                if (state.mode === "sequential") {
                    const sorted = [...state.questionPool].sort((a, b) => {
                        const unitCmp = (a.unitNumber ?? 0) - (b.unitNumber ?? 0);
                        return unitCmp || ((a.no ?? 0) - (b.no ?? 0));
                    });

                    const idxById = new Map(sorted.map((q, idx) => [q.id, idx]));
                    const start = state.activeQuestion && idxById.has(state.activeQuestion.id)
                        ? idxById.get(state.activeQuestion.id) + 1
                        : 0;

                    for (let offset = 0; offset < sorted.length; offset++) {
                        const idx = (start + offset) % sorted.length;
                        const q = sorted[idx];
                        if (!scopeData.correct?.[q.id]) return q;
                    }
                    return null;
                }

                if (avoidId && remaining.length > 1) {
                    const filtered = remaining.filter((q) => q.id !== avoidId);
                    if (filtered.length) return pickRandom(filtered);
                }
                return pickRandom(remaining);
            }

            function finishIfDone() {
                const stats = computeStats();
                if (stats.remainingCount > 0) return false;
                doneText.textContent = `Bu seçim için yüklenen tüm sorular bitti. (Yüklenen: ${stats.totalLoaded}, Doğru: ${stats.correctCount})`;
                showOnly("done");
                return true;
            }

            async function startQuiz() {
                try {
                    showOnly("setup");

                    const lesson = LESSONS.find((x) => x.key === lessonSelect.value);
                    if (!lesson) throw new Error("Ders seçimi bulunamadı");

                    const master = await loadMaster(lesson);
                    state.currentLesson = lesson;
                    state.currentMaster = master;
                    state.mode = modeSelect.value;
                    state.scopeKey = getScopeKey(lesson.key);
                    state.currentUnit = null;
                    state.questionPool = [];

                    const selectedUnitFile = unitSelect.value;
                    if (state.mode === "all_random") {
                        for (const unit of master.units) {
                            const unitJson = await fetchJson(`${lesson.key}/${unit.fileName}`);
                            state.questionPool.push(...buildPoolFromUnitJson(lesson.key, unit.fileName, unitJson));
                        }
                    } else {
                        const unit = master.units.find((x) => x.fileName === selectedUnitFile);
                        if (!unit) throw new Error("Ünite seçimi bulunamadı");
                        state.currentUnit = unit;
                        const unitJson = await fetchJson(`${lesson.key}/${unit.fileName}`);
                        state.questionPool = buildPoolFromUnitJson(lesson.key, unit.fileName, unitJson);
                    }

                    if (!state.questionPool.length) throw new Error("Soru bulunamadı (pool boş)");
                    if (finishIfDone()) return;

                    const next = pickNextQuestion(null);
                    if (!next) {
                        finishIfDone();
                        return;
                    }
                    renderQuestion(next);
                } catch (e) {
                    setError(e?.message ?? String(e));
                }
            }

            function resetProgress() {
                const lesson = LESSONS.find((x) => x.key === lessonSelect.value);
                if (!lesson) return;

                const ok = confirm("Bu seçim için doğru geçmişi sıfırlansın mı?\n\nNot: Bu işlem geri alınamaz.");
                if (!ok) return;

                const progress = loadProgress();
                const scopeKey = getScopeKey(lesson.key);
                for (const key of Object.keys(progress)) {
                    if (key === scopeKey || key.startsWith(`${lesson.key}::`)) delete progress[key];
                }
                saveProgress(progress);
                updateSetupHint();
                alert("Sıfırlandı.");
            }

            lessonSelect.addEventListener("change", refreshUnits);
            unitSelect.addEventListener("change", updateSetupHint);
            modeSelect.addEventListener("change", updateSetupHint);

            startBtn.addEventListener("click", startQuiz);
            resetBtn.addEventListener("click", resetProgress);

            nextBtn.addEventListener("click", () => {
                if (finishIfDone()) return;
                const avoidId = state.hasAnsweredCurrent ? null : (state.activeQuestion?.id ?? null);
                const next = pickNextQuestion(avoidId);
                if (!next) {
                    finishIfDone();
                    return;
                }
                renderQuestion(next);
            });

            backToSetupBtn.addEventListener("click", () => showOnly("setup"));
            doneBackBtn.addEventListener("click", () => showOnly("setup"));

            (async function init() {
                try {
                    await hydrateLessonTitles();
                    populateLessonSelect();
                    await refreshUnits();
                    updateSetupHint();
                } catch (e) {
                    setError(e?.message ?? String(e));
                }
            })();
        })();
    </script>
